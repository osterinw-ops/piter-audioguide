name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk piter-audioguide.apk
      - uses: actions/upload-artifact@v4
        with:
          name: piter-audioguide
          path: piter-audioguide.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest piter-audioguide.apk --title "Аудиогид: парадные Петербурга" --notes "Скачайте APK на телефон и установите (разрешите установку из неизвестных источников)."
